name: JDBC geometry runtime validation

on:
  push:
    branches: ['validation/jdbc-geospatial-runtime']

permissions:
  contents: read

jobs:
  geometry:
    name: fixed
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CONTINUOUS_INTEGRATION: true
      MAVEN_OPTS: -Xmx2G -XX:+ExitOnOutOfMemoryError
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 8fec3a8d11c28cf486cdad275c17a6136617e76a
          persist-credentials: false
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          docker-images: false
          swap-storage: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Download Node.js to Maven cache
        run: .github/bin/download_nodejs
      - name: Build product-test distribution
        run: >-
          ./mvnw install -B -V --quiet -T 1C -DskipTests
          -Dair.check.skip-all --no-transfer-progress
          -Dmaven.javadoc.skip=true -am
          -pl '!presto-docs,!presto-spark-package,!presto-spark-launcher,!presto-spark-testing,!presto-test-coverage'
      - name: Analyze connector dependencies with inherited checks enabled
        run: >-
          ./mvnw -B --no-transfer-progress
          -pl presto-mysql,presto-postgresql
          -Dair.check.skip-dependency=false
          org.apache.maven.plugins:maven-dependency-plugin:3.8.1:analyze-only
      - name: Inspect packaged connector runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          for geometry_connector in mysql postgresql; do
            geometry_jar=$(find presto-server/target -type f -path "*/plugin/$geometry_connector/presto-geospatial-toolkit-*.jar" -print -quit)
            printf 'connector=%s toolkit=%s\n' "$geometry_connector" "$geometry_jar"
            test -n "$geometry_jar"
            jar tf "$geometry_jar" | grep -Fx 'com/facebook/presto/geospatial/serde/EsriGeometrySerde.class'
          done
      - name: Run geometry product regression
        shell: bash
        env:
          OVERRIDE_JDK_DIR: ${{ env.JAVA_HOME }}
        run: |
          set -euo pipefail
          presto-product-tests/bin/run_on_docker.sh singlenode-mysql -t com.facebook.presto.tests.mysql.TestMySqlGeometry.testReadGeometry 2>&1 | tee geometry-product-test.log
          grep -F '[1 of 1] com.facebook.presto.tests.mysql.TestMySqlGeometry.testReadGeometry' geometry-product-test.log
          grep -F 'Total tests run: 1, Passes: 1, Failures: 0, Skips: 0' geometry-product-test.log
